<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | VELOMETRIX Rider Portal</title>
  <meta name="description" content="Reset your VELOMETRIX rider account access credentials.">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#101D2C',
              secondary: '#34465B',
              accent: '#B7E64A',
              accentHover: '#A0D136',
              bgLight: '#F7F9FC',
              bgDark: '#101820',
              cardDark: '#16222F',
              muted: '#64748B'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="shortcut icon" href="favicon.ico">
</head>
<body class="bg-brand-bgLight dark:bg-brand-bgDark text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between">

  <!-- Minimal Header -->
  <header class="site-header py-6 px-4 sm:px-8 bg-white/95 dark:bg-brand-primary/95 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between transition-colors duration-200">
    <a href="index.html" class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-brand-accent/40 flex items-center justify-center text-brand-accent text-xl">
        <i class="bi bi-radar"></i>
      </div>
      <div class="text-xl font-extrabold text-slate-900 dark:text-white">
        VELO<span class="text-brand-accent">METRIX</span>
      </div>
    </a>
    <div class="flex items-center gap-3">
      <button class="theme-toggle-btn w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-700 dark:text-slate-300 hover:text-brand-accent transition-colors" aria-label="Toggle theme">
        <i class="bi bi-sun-fill text-amber-500 dark:text-amber-400"></i>
      </button>
      <a href="login.html" class="text-xs font-semibold text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white">
        Back to Sign In <i class="bi bi-arrow-right"></i>
      </a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center p-4 py-12">
    <div class="w-full max-w-md">
      
      <!-- Password Reset Card -->
      <div class="p-8 sm:p-10 rounded-3xl bg-white dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700 shadow-xl">
        <div class="text-center mb-8">
          <div class="w-12 h-12 rounded-2xl bg-lime-400/20 text-lime-600 dark:text-brand-accent flex items-center justify-center text-2xl mx-auto mb-4">
            <i class="bi bi-key-fill"></i>
          </div>
          <h1 class="text-2xl font-black text-slate-900 dark:text-white">Reset Account Password</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-2 leading-relaxed">
            Enter the email address associated with your VELOMETRIX rider profile. We will dispatch simulated reset instructions.
          </p>
        </div>

        <form id="forgotPasswordForm" data-validate="true" class="space-y-4" novalidate>
          <div class="form-group">
            <label for="resetEmail" class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-2">
              Email Address <span class="text-red-500">*</span>
            </label>
            <input type="email" id="resetEmail" required data-type="email" data-label="Email" placeholder="rider@velometrix-demo.com" class="w-full px-4 py-3 rounded-xl text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white focus:border-brand-accent focus:outline-none">
          </div>

          <div class="pt-2">
            <button type="submit" class="btn-accent w-full py-3.5 rounded-xl font-extrabold text-xs uppercase tracking-wider shadow-md">
              Send Password Reset Link
            </button>
          </div>
        </form>

        <div class="text-center mt-6 pt-6 border-t border-slate-100 dark:border-slate-700 text-xs text-slate-500 dark:text-slate-400">
          Remembered your password? 
          <a href="login.html" class="font-bold text-lime-600 dark:text-brand-accent hover:underline ml-1">Return to Sign In</a>
        </div>
      </div>

    </div>
  </main>

  <footer class="py-6 text-center text-xs text-slate-500 border-t border-slate-200 dark:border-slate-800">
    &copy; 2026 VELOMETRIX Performance Studio. Frontend Demonstration.
  </footer>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.getElementById("forgotPasswordForm")?.addEventListener("submit", (e) => {
      e.preventDefault();
      const form = e.target;
      if (window.VelometrixValidation && !window.VelometrixValidation.validateForm(form)) {
        return;
      }
      const email = document.getElementById("resetEmail").value.trim();
      VelometrixToast.show(`Simulated password reset instructions sent to ${email}.`, "success", 5000);
      form.reset();
    });
  </script>
</body>
</html>
