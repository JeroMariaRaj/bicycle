<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101D2C"/>
      <stop offset="50%" stop-color="#162A3D"/>
      <stop offset="100%" stop-color="#0E1620"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg3)"/>
  <!-- Telemetry Aerodynamics Wave Lines -->
  <g stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3" fill="none">
    <path d="M 0 150 Q 150 180, 300 140 T 600 180"/>
    <path d="M 0 250 Q 180 200, 320 270 T 600 230"/>
    <path d="M 0 350 Q 200 320, 350 390 T 600 340"/>
    <path d="M 0 450 Q 170 480, 310 440 T 600 470"/>
    <path d="M 0 550 Q 220 520, 380 570 T 600 530"/>
  </g>
  <g stroke="#B7E64A" stroke-width="1.5" stroke-opacity="0.5" fill="none">
    <path d="M 0 290 Q 220 260, 360 310 T 600 280"/>
    <path d="M 0 390 Q 180 430, 330 380 T 600 420"/>
  </g>
  
  <!-- Stylized Figure Avatar -->
  <g transform="translate(0, 40)">
    <ellipse cx="300" cy="340" rx="130" ry="170" fill="#38BDF8" opacity="0.06"/>
    <!-- Head -->
    <circle cx="300" cy="240" r="75" fill="#243C52"/>
    <!-- Torso and Shoulders -->
    <path d="M 160 540 C 175 380, 240 330, 300 330 C 360 330, 425 380, 440 540 Z" fill="#1B3145"/>
    <path d="M 270 330 L 300 400 L 330 330 Z" fill="#101D2C"/>
    <line x1="300" y1="350" x2="300" y2="430" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <rect x="230" y="450" width="140" height="32" rx="16" fill="#101D2C" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="300" y="471" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">AERO COACH</text>
  </g>
  
  <!-- Data Badges & Graphic Overlays -->
  <rect x="50" y="590" width="500" height="150" rx="16" fill="#101D2C" fill-opacity="0.9" stroke="#2D3D4F" stroke-width="1.5"/>
  <text x="80" y="635" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">Marcus Lindqvist, M.Sc.</text>
  <text x="80" y="662" fill="#B7E64A" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">AERODYNAMICS &amp; TIME-TRIAL SPECIALIST</text>
  <text x="80" y="700" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Wind Tunnel Testing, CdA Drag Optimization, Kona Qualifier Coach</text>
  
  <g transform="translate(480, 620)">
    <circle cx="20" cy="20" r="24" fill="#38BDF8" fill-opacity="0.15"/>
    <path d="M 12 20 L 18 26 L 28 14" stroke="#38BDF8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
