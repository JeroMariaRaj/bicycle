<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101D2C"/>
      <stop offset="60%" stop-color="#1A2D42"/>
      <stop offset="100%" stop-color="#0B131C"/>
    </linearGradient>
    <linearGradient id="limeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B7E64A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9ECC3B" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B7E64A"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg2)"/>
  <!-- Telemetry Grid -->
  <g stroke="#34465B" stroke-width="1" stroke-opacity="0.3">
    <line x1="40" y1="0" x2="40" y2="800"/>
    <line x1="120" y1="0" x2="120" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="280" y1="0" x2="280" y2="800"/>
    <line x1="360" y1="0" x2="360" y2="800"/>
    <line x1="440" y1="0" x2="440" y2="800"/>
    <line x1="520" y1="0" x2="520" y2="800"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="500" x2="600" y2="500"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
    <line x1="0" y1="700" x2="600" y2="700"/>
  </g>
  <!-- Biomechanics Rings -->
  <circle cx="300" cy="340" r="180" stroke="#34465B" stroke-width="1.5" stroke-dasharray="6,6" fill="none" opacity="0.4"/>
  <circle cx="300" cy="340" r="140" stroke="#B7E64A" stroke-width="1" stroke-dasharray="4,8" fill="none" opacity="0.6"/>
  
  <!-- Stylized Figure Avatar -->
  <g transform="translate(0, 40)">
    <!-- Aura Glow -->
    <ellipse cx="300" cy="340" rx="130" ry="170" fill="#B7E64A" opacity="0.08"/>
    <!-- Head -->
    <circle cx="300" cy="240" r="75" fill="#22384D"/>
    <!-- Torso and Shoulders -->
    <path d="M 170 540 C 180 380, 240 330, 300 330 C 360 330, 420 380, 430 540 Z" fill="#1C3042"/>
    <!-- Quarter-zip / Collar Detail -->
    <path d="M 270 330 L 300 410 L 330 330 Z" fill="#101D2C"/>
    <line x1="300" y1="360" x2="300" y2="440" stroke="#B7E64A" stroke-width="3" stroke-linecap="round"/>
    <!-- Badge -->
    <rect x="230" y="450" width="140" height="32" rx="16" fill="#101D2C" stroke="#B7E64A" stroke-width="1.5"/>
    <text x="300" y="471" fill="#B7E64A" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">PT &amp; BIOMECHANIST</text>
  </g>
  <!-- Data Badges & Graphic Overlays -->
  <rect x="50" y="590" width="500" height="150" rx="16" fill="#101D2C" fill-opacity="0.9" stroke="#2D3D4F" stroke-width="1.5"/>
  <text x="80" y="635" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">Dr. Elena Rostova, DPT</text>
  <text x="80" y="662" fill="#B7E64A" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">SPORTS PHYSIOTHERAPIST &amp; BIOMECHANIST</text>
  <text x="80" y="700" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Specialist in Pelvic Asymmetry &amp; Overuse Injury Prevention</text>
  
  <g transform="translate(480, 620)">
    <circle cx="20" cy="20" r="24" fill="#B7E64A" fill-opacity="0.15"/>
    <path d="M 12 20 L 18 26 L 28 14" stroke="#B7E64A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
