<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101D2C"/>
      <stop offset="50%" stop-color="#1B2838"/>
      <stop offset="100%" stop-color="#0E1722"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg4)"/>
  <!-- Concentric Alignment Targets -->
  <circle cx="300" cy="300" r="220" stroke="#34465B" stroke-width="1" stroke-dasharray="8,8" fill="none" opacity="0.3"/>
  <circle cx="300" cy="300" r="160" stroke="#B7E64A" stroke-width="1.5" stroke-dasharray="4,6" fill="none" opacity="0.5"/>
  <line x1="300" y1="50" x2="300" y2="550" stroke="#B7E64A" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="50" y1="300" x2="550" y2="300" stroke="#B7E64A" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Stylized Figure Avatar -->
  <g transform="translate(0, 40)">
    <ellipse cx="300" cy="340" rx="130" ry="170" fill="#B7E64A" opacity="0.06"/>
    <!-- Head -->
    <circle cx="300" cy="240" r="75" fill="#24384D"/>
    <!-- Torso and Shoulders -->
    <path d="M 170 540 C 180 380, 240 330, 300 330 C 360 330, 420 380, 430 540 Z" fill="#1C2E40"/>
    <path d="M 270 330 L 300 400 L 330 330 Z" fill="#101D2C"/>
    <line x1="300" y1="350" x2="300" y2="430" stroke="#B7E64A" stroke-width="3" stroke-linecap="round"/>
    <rect x="220" y="450" width="160" height="32" rx="16" fill="#101D2C" stroke="#B7E64A" stroke-width="1.5"/>
    <text x="300" y="471" fill="#B7E64A" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">PODIATRY &amp; CLEAT</text>
  </g>

  <!-- Data Badges & Graphic Overlays -->
  <rect x="50" y="590" width="500" height="150" rx="16" fill="#101D2C" fill-opacity="0.9" stroke="#2D3D4F" stroke-width="1.5"/>
  <text x="80" y="635" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">Claire Moreau, B.Sc.</text>
  <text x="80" y="662" fill="#B7E64A" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">FOOT-PEDAL INTERFACE &amp; CLEAT SPECIALIST</text>
  <text x="80" y="700" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Custom Orthotics, Varus/Valgus Forefoot Wedging, Hot-Foot Relief</text>

  <g transform="translate(480, 620)">
    <circle cx="20" cy="20" r="24" fill="#B7E64A" fill-opacity="0.15"/>
    <path d="M 12 20 L 18 26 L 28 14" stroke="#B7E64A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
