<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgB4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101D2C"/>
      <stop offset="100%" stop-color="#182A3A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgB4)"/>
  <!-- Shoe Sole Outline -->
  <g transform="translate(180, 50)">
    <path d="M 220 50 C 310 50, 340 150, 320 280 C 300 370, 270 410, 220 410 C 170 410, 140 370, 120 280 C 100 150, 130 50, 220 50 Z" fill="#152433" stroke="#475569" stroke-width="4"/>
    <!-- Cleat Placement Grid -->
    <rect x="170" y="140" width="100" height="90" rx="12" fill="#1E293B" stroke="#B7E64A" stroke-width="2"/>
    <!-- Cleat 3-bolt pattern -->
    <circle cx="220" cy="165" r="7" fill="#B7E64A"/>
    <circle cx="195" cy="205" r="7" fill="#B7E64A"/>
    <circle cx="245" cy="205" r="7" fill="#B7E64A"/>
    <!-- Float Rotation Arc -->
    <path d="M 180 120 A 50 50 0 0 1 260 120" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4,4"/>
    <text x="220" y="110" fill="#38BDF8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">±6° ROTATIONAL FLOAT</text>
    <!-- Varus Tilt Indicator -->
    <path d="M 340 180 L 380 180 L 380 200 Z" fill="#F59E0B"/>
    <text x="390" y="195" fill="#F59E0B" font-family="system-ui" font-size="12" font-weight="700">1.5° VARUS WEDGE</text>
  </g>
  <rect x="40" y="40" width="160" height="32" rx="16" fill="#101D2C" stroke="#B7E64A" stroke-width="1.5"/>
  <text x="120" y="61" fill="#B7E64A" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">FOOT-PEDAL INTERFACE</text>
</svg>
