<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgB6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101D2C"/>
      <stop offset="100%" stop-color="#1A2B3D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgB6)"/>
  <!-- Drop bar diagram with Stack and Reach markers -->
  <g transform="translate(180, 80)">
    <!-- Flared drop bar shape -->
    <path d="M 80 180 C 120 180, 160 170, 200 170 C 230 170, 270 180, 310 220 C 330 250, 320 320, 280 340" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <path d="M 80 180 L 40 180" stroke="#334155" stroke-width="14" stroke-linecap="round"/>
    <!-- Flare Angle Arc -->
    <path d="M 280 340 L 340 370" stroke="#B7E64A" stroke-width="4" stroke-dasharray="6,4"/>
    <text x="360" y="375" fill="#B7E64A" font-family="system-ui" font-size="16" font-weight="700">16° OUTWARD FLARE</text>
    <!-- Stack & Reach coordinate arrows -->
    <line x1="40" y1="180" x2="40" y2="380" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="40" y1="380" x2="280" y2="380" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="160" y="405" fill="#38BDF8" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">REACH: 382mm</text>
    <text x="15" y="280" fill="#38BDF8" font-family="system-ui" font-size="14" font-weight="700" transform="rotate(-90 15,280)">STACK: 595mm</text>
  </g>
  <rect x="40" y="40" width="160" height="32" rx="16" fill="#101D2C" stroke="#B7E64A" stroke-width="1.5"/>
  <text x="120" y="61" fill="#B7E64A" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">GRAVEL &amp; ENDURANCE</text>
</svg>
