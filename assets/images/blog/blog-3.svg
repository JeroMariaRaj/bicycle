<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgB3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101D2C"/>
      <stop offset="100%" stop-color="#182838"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgB3)"/>
  <!-- CFD Aerodynamic Airflow Ribbons -->
  <g stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.6">
    <path d="M 50 160 C 250 160, 350 120, 500 130 C 650 140, 750 170, 750 170"/>
    <path d="M 50 200 C 260 200, 360 170, 480 180 C 600 190, 750 220, 750 220" stroke="#B7E64A"/>
    <path d="M 50 240 C 240 240, 380 230, 490 240 C 620 250, 750 280, 750 280"/>
    <path d="M 50 280 C 230 280, 340 290, 460 300 C 580 310, 750 340, 750 340" stroke="#38BDF8" stroke-dasharray="8,4"/>
  </g>
  <!-- Aerodynamic Metrics HUD Box -->
  <g transform="translate(100, 100)">
    <rect width="280" height="260" rx="16" fill="#101D2C" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="50" fill="#94A3B8" font-family="system-ui" font-size="13" font-weight="600">FRONTAL AREA (CdA)</text>
    <text x="30" y="95" fill="#B7E64A" font-family="system-ui" font-size="38" font-weight="800">0.218 m²</text>
    <text x="30" y="145" fill="#94A3B8" font-family="system-ui" font-size="13" font-weight="600">WATTS SAVED @ 45 KM/H</text>
    <text x="30" y="190" fill="#38BDF8" font-family="system-ui" font-size="36" font-weight="800">-24.5 W</text>
    <text x="30" y="230" fill="#10B981" font-family="system-ui" font-size="13" font-weight="600">✓ Comfort Index: 92/100</text>
  </g>
  <!-- Aero Helmet & Torso Silhouette Outline -->
  <g transform="translate(420, 140)" stroke="#B7E64A" stroke-width="3" fill="none">
    <!-- Teardrop Helmet -->
    <path d="M 80 50 C 130 30, 200 40, 250 80 C 190 85, 140 90, 90 90 Z" fill="#1E293B"/>
    <circle cx="100" cy="70" r="12" fill="#B7E64A" fill-opacity="0.3"/>
    <!-- Aero spine curvature -->
    <path d="M 120 90 Q 200 130, 260 210" stroke-width="4"/>
  </g>
  <rect x="40" y="40" width="160" height="32" rx="16" fill="#101D2C" stroke="#B7E64A" stroke-width="1.5"/>
  <text x="120" y="61" fill="#B7E64A" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">AERODYNAMICS</text>
</svg>
