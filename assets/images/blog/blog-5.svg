<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgB5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101D2C"/>
      <stop offset="100%" stop-color="#16283C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgB5)"/>
  <!-- Split comparison design -->
  <line x1="400" y1="50" x2="400" y2="450" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
  
  <!-- Left: Static Fit (Manual Goniometer) -->
  <g transform="translate(60, 100)">
    <rect width="280" height="40" rx="8" fill="#1E293B"/>
    <text x="140" y="26" fill="#94A3B8" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">STATIC FITTING</text>
    <!-- Analog Goniometer Icon -->
    <circle cx="140" cy="160" r="70" fill="none" stroke="#64748B" stroke-width="3"/>
    <line x1="140" y1="160" x2="190" y2="110" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
    <line x1="140" y1="160" x2="90" y2="210" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
    <text x="140" y="270" fill="#EF4444" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">❌ Unloaded Joint Angles</text>
    <text x="140" y="295" fill="#94A3B8" font-family="system-ui" font-size="12" text-anchor="middle">Misses dynamic ankle ankling</text>
  </g>

  <!-- Right: Dynamic 3D Motion (60 FPS Optical Tracking) -->
  <g transform="translate(460, 100)">
    <rect width="280" height="40" rx="8" fill="#101D2C" stroke="#B7E64A" stroke-width="1.5"/>
    <text x="140" y="26" fill="#B7E64A" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">DYNAMIC 3D MOTION CAPTURE</text>
    <!-- Real-time skeletal joints -->
    <circle cx="100" cy="120" r="8" fill="#38BDF8"/>
    <line x1="100" y1="120" x2="170" y2="170" stroke="#B7E64A" stroke-width="4"/>
    <circle cx="170" cy="170" r="10" fill="#B7E64A"/>
    <line x1="170" y1="170" x2="120" y2="230" stroke="#38BDF8" stroke-width="4"/>
    <circle cx="120" cy="230" r="8" fill="#38BDF8"/>
    <!-- Motion wave -->
    <path d="M 50 200 Q 140 140, 230 200 T 320 200" fill="none" stroke="#B7E64A" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="140" y="270" fill="#B7E64A" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">✓ Full Pedal Stroke Data</text>
    <text x="140" y="295" fill="#94A3B8" font-family="system-ui" font-size="12" text-anchor="middle">60Hz Real-Time Continuous Tracking</text>
  </g>

  <rect x="40" y="40" width="160" height="32" rx="16" fill="#101D2C" stroke="#B7E64A" stroke-width="1.5"/>
  <text x="120" y="61" fill="#B7E64A" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">TECHNOLOGY COMPARISON</text>
</svg>
