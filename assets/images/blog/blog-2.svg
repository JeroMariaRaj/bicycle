<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgB2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101D2C"/>
      <stop offset="100%" stop-color="#1A2D42"/>
    </linearGradient>
    <radialGradient id="heatRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgB2)"/>
  <!-- Telemetry Grid -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.25">
    <circle cx="400" cy="250" r="120" fill="none"/>
    <circle cx="400" cy="250" r="180" fill="none"/>
    <circle cx="400" cy="250" r="230" fill="none"/>
    <line x1="150" y1="250" x2="650" y2="250"/>
    <line x1="400" y1="50" x2="400" y2="450"/>
  </g>
  <!-- Saddle Outline -->
  <path d="M 400 90 C 430 90, 435 180, 440 230 C 470 290, 500 360, 480 400 C 460 430, 420 420, 400 420 C 380 420, 340 430, 320 400 C 300 360, 330 290, 360 230 C 365 180, 370 90, 400 90 Z" fill="#152433" stroke="#475569" stroke-width="3"/>
  <!-- Sit bone heatmaps -->
  <ellipse cx="360" cy="350" rx="45" ry="35" fill="url(#heatRed)"/>
  <ellipse cx="440" cy="350" rx="45" ry="35" fill="url(#heatRed)"/>
  <circle cx="360" cy="350" r="12" fill="#EF4444"/>
  <circle cx="440" cy="350" r="12" fill="#EF4444"/>
  <!-- Pressure Scale Bar -->
  <g transform="translate(620, 150)">
    <rect width="24" height="200" rx="12" fill="#1E293B" stroke="#475569"/>
    <rect x="4" y="4" width="16" height="40" rx="8" fill="#EF4444"/>
    <rect x="4" y="48" width="16" height="40" rx="8" fill="#F59E0B"/>
    <rect x="4" y="92" width="16" height="50" rx="8" fill="#10B981"/>
    <rect x="4" y="146" width="16" height="48" rx="8" fill="#3B82F6"/>
    <text x="35" y="25" fill="#EF4444" font-family="system-ui" font-size="11" font-weight="700">MAX</text>
    <text x="35" y="180" fill="#3B82F6" font-family="system-ui" font-size="11" font-weight="700">LOW</text>
  </g>
  <!-- Text Overlays -->
  <rect x="40" y="40" width="160" height="32" rx="16" fill="#101D2C" stroke="#B7E64A" stroke-width="1.5"/>
  <text x="120" y="61" fill="#B7E64A" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">PRESSURE MAPPING</text>
  <text x="400" y="465" fill="#E2E8F0" font-family="system-ui" font-size="15" font-weight="600" text-anchor="middle">Ischial Tuberosity Weight Distribution: 50% L / 50% R</text>
</svg>
