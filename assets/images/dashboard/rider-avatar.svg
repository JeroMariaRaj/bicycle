<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="avGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#avGrad)"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#B7E64A" stroke-width="4"/>
  <!-- Cyclist Profile silhouette with helmet -->
  <g transform="translate(50, 40)">
    <!-- Helmet with visor -->
    <path d="M 30 15 C 60 5, 80 15, 95 35 C 75 40, 50 40, 20 30 Z" fill="#B7E64A"/>
    <!-- Head -->
    <circle cx="50" cy="40" r="22" fill="#38BDF8"/>
    <!-- Neck and shoulders in cycling jersey -->
    <path d="M 10 95 C 20 65, 40 60, 50 60 C 60 60, 80 65, 90 95 Z" fill="#1E293B"/>
    <!-- Zipper stripe -->
    <line x1="50" y1="60" x2="50" y2="95" stroke="#B7E64A" stroke-width="3"/>
  </g>
</svg>
