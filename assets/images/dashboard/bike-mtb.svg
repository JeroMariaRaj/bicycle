<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBk3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101D2C"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" rx="12" fill="url(#bgBk3)"/>
  <g transform="translate(40, 25)" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Knobby Tires -->
    <circle cx="50" cy="150" r="48" stroke="#334155" stroke-width="8" stroke-dasharray="8,4"/>
    <circle cx="270" cy="150" r="48" stroke="#334155" stroke-width="8" stroke-dasharray="8,4"/>
    <circle cx="50" cy="150" r="5" fill="#10B981" stroke="none"/>
    <circle cx="270" cy="150" r="5" fill="#10B981" stroke="none"/>
    <!-- Bottom bracket -->
    <circle cx="150" cy="155" r="10" stroke="#10B981" stroke-width="4"/>
    <!-- Rear triangle with pivot linkage -->
    <line x1="50" y1="150" x2="150" y2="155" stroke="#94A3B8"/>
    <line x1="50" y1="150" x2="135" y2="95" stroke="#94A3B8"/>
    <line x1="135" y1="95" x2="150" y2="120" stroke="#10B981" stroke-width="5"/> <!-- Rear Shock -->
    <!-- Seat tube -->
    <line x1="150" y1="155" x2="135" y2="85" stroke="#10B981" stroke-width="5"/>
    <line x1="135" y1="85" x2="130" y2="55" stroke="#10B981" stroke-width="4"/> <!-- Dropper post -->
    <!-- MTB Saddle -->
    <path d="M 112 55 L 152 57" stroke="#FFFFFF" stroke-width="6"/>
    <!-- Sloping Down tube -->
    <line x1="150" y1="155" x2="250" y2="65" stroke="#10B981" stroke-width="6"/>
    <!-- Sloping Top tube -->
    <line x1="135" y1="85" x2="245" y2="65" stroke="#10B981" stroke-width="5"/>
    <!-- Suspension Fork Stanchions -->
    <line x1="248" y1="60" x2="260" y2="105" stroke="#FFFFFF" stroke-width="5"/>
    <line x1="260" y1="105" x2="270" y2="150" stroke="#F59E0B" stroke-width="6"/>
    <!-- Wide Riser Handlebars -->
    <line x1="252" y1="50" x2="265" y2="45" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="260" y1="45" x2="275" y2="42" stroke="#10B981" stroke-width="6"/>
  </g>
</svg>
