<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBk2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101D2C"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" rx="12" fill="url(#bgBk2)"/>
  <g transform="translate(40, 25)" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wheels (Rear Disc, Front Deep Section) -->
    <circle cx="50" cy="150" r="45" fill="#334155" stroke="#475569" stroke-width="4"/>
    <circle cx="270" cy="150" r="45" stroke="#475569" stroke-width="10"/>
    <circle cx="50" cy="150" r="5" fill="#38BDF8" stroke="none"/>
    <circle cx="270" cy="150" r="5" fill="#38BDF8" stroke="none"/>
    <!-- Bottom bracket -->
    <circle cx="150" cy="150" r="10" stroke="#38BDF8" stroke-width="4"/>
    <!-- Aero Frame geometry -->
    <line x1="50" y1="150" x2="150" y2="150" stroke="#94A3B8"/>
    <line x1="50" y1="150" x2="140" y2="65" stroke="#94A3B8"/>
    <!-- Steep 78 degree Seat tube -->
    <line x1="150" y1="150" x2="145" y2="65" stroke="#38BDF8" stroke-width="6"/>
    <line x1="145" y1="65" x2="143" y2="35" stroke="#38BDF8" stroke-width="5"/>
    <!-- TT Saddle -->
    <path d="M 125 35 L 165 37" stroke="#FFFFFF" stroke-width="7"/>
    <!-- Deep aero Down tube -->
    <line x1="150" y1="150" x2="250" y2="65" stroke="#38BDF8" stroke-width="8"/>
    <line x1="145" y1="65" x2="250" y2="65" stroke="#38BDF8" stroke-width="6"/>
    <!-- Head tube -->
    <line x1="250" y1="65" x2="255" y2="50" stroke="#FFFFFF" stroke-width="6"/>
    <!-- Aero Fork -->
    <line x1="253" y1="60" x2="270" y2="150" stroke="#94A3B8" stroke-width="6"/>
    <!-- Base bar and Aero extensions -->
    <line x1="255" y1="50" x2="275" y2="50" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="265" y1="40" x2="295" y2="35" stroke="#B7E64A" stroke-width="4"/>
    <path d="M 295 35 L 305 28" stroke="#B7E64A" stroke-width="4"/>
  </g>
</svg>
