<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101D2C"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" rx="12" fill="url(#bgBk)"/>
  <g transform="translate(40, 25)" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wheels -->
    <circle cx="50" cy="150" r="45" stroke="#475569" stroke-width="6"/>
    <circle cx="270" cy="150" r="45" stroke="#475569" stroke-width="6"/>
    <circle cx="50" cy="150" r="5" fill="#B7E64A" stroke="none"/>
    <circle cx="270" cy="150" r="5" fill="#B7E64A" stroke="none"/>
    <!-- Bottom bracket -->
    <circle cx="150" cy="150" r="10" stroke="#B7E64A" stroke-width="4"/>
    <!-- Frame geometry (Road Race) -->
    <!-- Chainstay -->
    <line x1="50" y1="150" x2="150" y2="150" stroke="#94A3B8"/>
    <!-- Seatstay -->
    <line x1="50" y1="150" x2="135" y2="70" stroke="#94A3B8"/>
    <!-- Seat tube -->
    <line x1="150" y1="150" x2="135" y2="70" stroke="#B7E64A" stroke-width="5"/>
    <line x1="135" y1="70" x2="130" y2="40" stroke="#B7E64A" stroke-width="4"/> <!-- Seatpost -->
    <!-- Saddle -->
    <path d="M 110 40 L 155 42" stroke="#FFFFFF" stroke-width="6"/>
    <!-- Down tube -->
    <line x1="150" y1="150" x2="250" y2="70" stroke="#B7E64A" stroke-width="6"/>
    <!-- Top tube -->
    <line x1="135" y1="70" x2="245" y2="70" stroke="#B7E64A" stroke-width="5"/>
    <!-- Head tube -->
    <line x1="245" y1="70" x2="252" y2="55" stroke="#FFFFFF" stroke-width="6"/>
    <!-- Fork -->
    <line x1="248" y1="65" x2="270" y2="150" stroke="#94A3B8" stroke-width="5"/>
    <!-- Stem and Drop bar -->
    <line x1="252" y1="55" x2="270" y2="52" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M 270 52 C 285 52, 285 75, 275 85" stroke="#B7E64A" stroke-width="4"/>
  </g>
</svg>
