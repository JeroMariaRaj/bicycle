<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rider Portal Login | VELOMETRIX Studio</title>
  <meta name="description" content="Access your personalized VELOMETRIX Rider Dashboard, appointment schedule, and biomechanical fit history.">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#101D2C',
              secondary: '#34465B',
              accent: '#B7E64A',
              accentHover: '#A0D136',
              bgLight: '#F7F9FC',
              bgDark: '#101820',
              cardDark: '#16222F',
              muted: '#64748B'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="shortcut icon" href="favicon.ico">
</head>
<body class="bg-brand-bgLight dark:bg-brand-bgDark text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between relative transition-colors duration-200">

  <!-- Desktop Top Controls (Right Side) -->
  <div class="hidden sm:flex absolute top-5 right-5 sm:top-6 sm:right-8 items-center gap-2.5 z-20">
    <!-- RTL Toggle -->
    <button class="rtl-toggle-btn px-2.5 h-9 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-700 dark:text-slate-300 hover:text-lime-600 dark:hover:text-brand-accent transition-colors shadow-sm" aria-label="Toggle layout direction" title="Toggle RTL">
      <span class="rtl-status-text">RTL</span>
    </button>

    <!-- Theme Toggle -->
    <button class="theme-toggle-btn w-9 h-9 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-700 dark:text-slate-300 hover:text-lime-600 dark:hover:text-brand-accent transition-colors shadow-sm" aria-label="Toggle theme" title="Toggle theme">
      <i class="bi bi-sun-fill text-amber-500"></i>
    </button>
  </div>

  <main class="flex-1 flex items-center justify-center p-4 py-12">
    <div class="w-full max-w-md">
      
      <!-- Login Card -->
      <div class="p-8 sm:p-10 rounded-3xl bg-white dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700 shadow-xl">
        
        <!-- Home 1 Logo & Title Inside Container -->
        <div class="flex justify-center mb-6">
          <a href="index.html" class="auth-brand inline-flex items-center gap-2 sm:gap-3 group shrink-0">
            <div class="brand-icon-box w-9 h-9 sm:w-11 sm:h-11 rounded-lg sm:rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-brand-accent/40 flex items-center justify-center text-slate-900 dark:text-brand-accent text-xl sm:text-2xl shadow-sm dark:shadow-lg dark:shadow-brand-accent/10 group-hover:border-lime-500 dark:group-hover:border-brand-accent transition-all shrink-0">
              <i class="bi bi-radar"></i>
            </div>
            <div class="text-left">
              <div class="brand-logo-title text-base sm:text-xl font-extrabold tracking-tight text-slate-900 dark:text-white flex items-center gap-1 whitespace-nowrap">
                VELO<span class="text-lime-600 dark:text-brand-accent">METRIX</span>
              </div>
              <div class="brand-logo-sub text-[7.5px] sm:text-[10px] tracking-normal sm:tracking-widest uppercase font-semibold text-slate-500 dark:text-slate-400 whitespace-nowrap">Fitting &amp; Performance Lab</div>
            </div>
          </a>
        </div>

        <div class="text-center mb-8">
          <h1 class="text-2xl font-black text-slate-900 dark:text-white">Rider Portal Login</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Access your bicycle measurements and upcoming lab sessions</p>
        </div>

        <form id="riderLoginForm" data-validate="true" class="space-y-4" novalidate>
          <div class="form-group">
            <label for="loginEmail" class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-2">
              Email Address <span class="text-red-500">*</span>
            </label>
            <input type="email" id="loginEmail" required data-type="email" data-label="Email" placeholder="Enter your email address" class="w-full px-4 py-3 rounded-xl text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white focus:border-brand-accent focus:outline-none">
          </div>

          <div class="form-group">
            <div class="flex items-center justify-between mb-2">
              <label for="loginPassword" class="text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300">
                Password <span class="text-red-500">*</span>
              </label>
              <a href="forgot-password.html" class="text-xs text-brand-accent hover:underline">Forgot password?</a>
            </div>
            <div class="relative">
              <input type="password" id="loginPassword" required data-label="Password" placeholder="Enter your password" class="w-full px-4 py-3 rounded-xl text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white focus:border-brand-accent focus:outline-none pr-10">
              <button type="button" id="togglePasswordBtn" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200 text-sm" aria-label="Toggle password visibility">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="flex items-center justify-between text-xs pt-1">
            <label class="flex items-center gap-2 cursor-pointer text-slate-600 dark:text-slate-400">
              <input type="checkbox" id="rememberMe" class="rounded accent-lime-400">
              <span>Remember this session</span>
            </label>
          </div>

          <div class="pt-3">
            <button type="submit" class="btn-accent w-full py-3.5 rounded-xl font-extrabold text-xs uppercase tracking-wider shadow-md">
              Sign In
            </button>
          </div>

          <!-- Divider -->
          <div class="relative my-5 text-center">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-slate-200 dark:border-slate-700"></div>
            </div>
            <span class="relative px-3 text-xs bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400 font-medium">or continue with</span>
          </div>

          <!-- Google and Apple Sign-In Buttons -->
          <div class="grid grid-cols-2 gap-3">
            <button type="button" class="social-login-btn flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/60 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs font-bold transition-all shadow-sm group">
              <i class="bi bi-google text-red-500 text-sm group-hover:scale-110 transition-transform"></i>
              <span>Google</span>
            </button>
            <button type="button" class="social-login-btn flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/60 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs font-bold transition-all shadow-sm group">
              <i class="bi bi-apple text-slate-900 dark:text-white text-sm group-hover:scale-110 transition-transform"></i>
              <span>Apple</span>
            </button>
          </div>
        </form>

        <div class="text-center mt-6 pt-6 border-t border-slate-100 dark:border-slate-700 text-xs text-slate-500 dark:text-slate-400">
          First-time rider at VELOMETRIX? 
          <a href="register.html" class="font-bold text-lime-600 dark:text-brand-accent hover:underline ml-1">Create an account</a>
        </div>
      </div>

      <!-- Mobile Controls (Under Container) -->
      <div class="flex sm:hidden items-center justify-center gap-3 mt-6">
        <!-- RTL Toggle -->
        <button class="rtl-toggle-btn px-3 h-9 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-700 dark:text-slate-300 hover:text-lime-600 dark:hover:text-brand-accent transition-colors shadow-sm" aria-label="Toggle layout direction" title="Toggle RTL">
          <span class="rtl-status-text">RTL</span>
        </button>

        <!-- Theme Toggle -->
        <button class="theme-toggle-btn w-9 h-9 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-700 dark:text-slate-300 hover:text-lime-600 dark:hover:text-brand-accent transition-colors shadow-sm" aria-label="Toggle theme" title="Toggle theme">
          <i class="bi bi-sun-fill text-amber-500"></i>
        </button>
      </div>

    </div>
  </main>

  <footer class="py-6 text-center text-xs text-slate-500 border-t border-slate-200 dark:border-slate-800">
    &copy; 2026 VELOMETRIX Performance Studio. Frontend Demonstration.
  </footer>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    // Toggle password visibility
    const toggleBtn = document.getElementById("togglePasswordBtn");
    const pwdInput = document.getElementById("loginPassword");
    toggleBtn?.addEventListener("click", () => {
      const type = pwdInput.type === "password" ? "text" : "password";
      pwdInput.type = type;
      toggleBtn.innerHTML = type === "password" ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
    });

    // Centered Login Success Modal
    function showLoginSuccessModal(email) {
      let modal = document.getElementById("login-success-modal");
      if (!modal) {
        modal = document.createElement("div");
        modal.id = "login-success-modal";
        modal.className = "modal-backdrop fixed inset-0 z-[9999] bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 transition-opacity duration-300";
        modal.setAttribute("role", "dialog");
        modal.setAttribute("aria-modal", "true");
        modal.innerHTML = `
          <div class="modal-dialog bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-3xl max-w-sm w-full p-6 sm:p-8 text-center shadow-2xl relative transform transition-all duration-300 scale-95 opacity-0">
            <button type="button" class="close-login-modal absolute top-5 right-5 w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-slate-900 dark:hover:text-white flex items-center justify-center transition-colors" aria-label="Close">
              <i class="bi bi-x-lg text-xs"></i>
            </button>
            
            <div class="w-16 h-16 rounded-2xl bg-lime-400/20 text-lime-600 dark:text-brand-accent text-3xl flex items-center justify-center mx-auto mb-4 border border-lime-400/40 shadow-lg">
              <i class="bi bi-check-circle-fill"></i>
            </div>

            <span class="inline-block px-3 py-1 rounded-full text-[11px] font-mono font-bold bg-lime-400/20 text-lime-700 dark:text-brand-accent border border-lime-400/30 uppercase tracking-wider mb-2">
              AUTHENTICATED
            </span>

            <h3 class="text-2xl font-black text-slate-900 dark:text-white mb-2">
              Login Successful!
            </h3>

            <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed mb-6">
              Welcome back to VELOMETRIX. Your session is active and verified.
            </p>

            <button type="button" class="close-login-modal w-full py-3 rounded-xl btn-accent text-xs font-extrabold uppercase tracking-wider shadow-lg">
              OK
            </button>
          </div>
        `;
        document.body.appendChild(modal);

        modal.querySelectorAll(".close-login-modal").forEach((btn) => {
          btn.addEventListener("click", () => closeLoginSuccessModal());
        });
        modal.addEventListener("click", (e) => {
          if (e.target === modal) closeLoginSuccessModal();
        });
      }

      modal.classList.remove("hidden");
      document.body.style.overflow = "hidden";
      requestAnimationFrame(() => {
        const dialog = modal.querySelector(".modal-dialog");
        if (dialog) {
          dialog.classList.remove("scale-95", "opacity-0");
          dialog.classList.add("scale-100", "opacity-100");
        }
      });
    }

    function closeLoginSuccessModal() {
      const modal = document.getElementById("login-success-modal");
      if (!modal) return;
      const dialog = modal.querySelector(".modal-dialog");
      if (dialog) {
        dialog.classList.remove("scale-100", "opacity-100");
        dialog.classList.add("scale-95", "opacity-0");
      }
      setTimeout(() => {
        modal.classList.add("hidden");
        document.body.style.overflow = "";
      }, 200);
    }

    // Handle Form Submit
    document.getElementById("riderLoginForm")?.addEventListener("submit", (e) => {
      e.preventDefault();
      const form = e.target;
      if (window.VelometrixValidation && !window.VelometrixValidation.validateForm(form)) {
        return;
      }
      const email = document.getElementById("loginEmail").value.trim();
      localStorage.setItem("velometrix_logged_in", "true");
      showLoginSuccessModal(email);
    });

    // Handle Social Login (Google & Apple)
    document.querySelectorAll(".social-login-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const provider = btn.querySelector("span")?.textContent.trim() || "OAuth";
        localStorage.setItem("velometrix_logged_in", "true");
        showLoginSuccessModal(`rider@${provider.toLowerCase()}.com`);
      });
    });
  </script>
</body>
</html>
